# Org-target policy for launchdarkly-demos/decor-agent.
# Same codebase allow/deny/budgets/verification as policy.decora.yaml, but flags are
# owned by LaunchDarkly Release Autopilot (flags.management: external).
version: 1
builder_max_turns: 40
builder_max_output_tokens: 16000
verify_retries: 4
per_task_retries: 4
max_job_attempts: 40
split_attempts: 4
whole_file_limit: 64000
excerpt_budget: 160000
max_retries:
  review: 1
  govern: 1
  plan: 2
  plan_repair: 2
stage_timeout_seconds:
  intake: 30
  context: 60
  plan: 120
  govern_plan: 30
  build: 600
  verify: 600
  ensure_flag: 90
  review: 120
  govern_ship: 30
  draft_pr: 60
command_timeout_seconds: 180
command_environment:
  # Catalog-only regression needs settings to parse; no model credential is needed.
  ANTHROPIC_API_KEY: factory-test-not-a-real-key
allow_commands:
- pytest
- ruff
- mypy
- python
- python3
- git
deny_command_patterns:
- git push
- git reset
- git clean
- git rebase
- --no-verify
- sudo
- rm -rf
- rm -r
git_subcommands:
- status
- diff
- add
- commit
- log
- show
- rev-parse
deny_paths:
- .env
- .env.*
- '**/*secret*'
- '**/*credential*'
- app/pim/**
approvals:
  auto_approve_risk:
  - low
  pause_on_ambiguous: true
  pause_on_risk:
  - high
flags:
  enabled: true
  management: external
  external_reason: >-
    LaunchDarkly Release Autopilot suggests flags and guarded releases on PRs in
    launchdarkly-demos/decor-agent
  key_pattern: '^decora-[a-z0-9-]+$'
  must_default_off: true

rollout_rules:
  user_facing_behavior: {flag: forbidden, guarded_rollout: none, human_pause: false}
  ui_cosmetic: {flag: forbidden, guarded_rollout: none, human_pause: false}
  backend_internal: {flag: forbidden, guarded_rollout: none, human_pause: false}
  data_migration: {flag: forbidden, guarded_rollout: none, human_pause: true}
  refactor: {flag: forbidden, guarded_rollout: none, human_pause: false}
  docs_only: {flag: forbidden, guarded_rollout: none, human_pause: false}
  tests_only: {flag: forbidden, guarded_rollout: none, human_pause: false}
  config_ci: {flag: forbidden, guarded_rollout: none, human_pause: false}
  dependency: {flag: forbidden, guarded_rollout: none, human_pause: false}

# No guarded_rollout metrics requirement: Release Autopilot owns rollouts.
pull_request:
  draft_only: true
  allow_push: true

issue_triggers:
  slug: launchdarkly-demos/decor-agent
  ready_label: factory:ready
  retry_label: factory:retry
  authors:
  - arober39
  labelers:
  - arober39
  # TODO(Alexis): add agent/bot logins that may open factory issues
  agent_accounts: []

regression_tests:
- test_api_project.py
- test_board.py
- test_flinch_gate.py

# These are required test contracts, not a claim that the target suites exist.
# The implementation must provide the suites; missing tests/tooling fail verification.
verification_profiles:
  studio-browser:
    description: >-
      Real Chromium acceptance tests using pytest-playwright in tests/browser.
      Implement fixtures that start/stop the isolated app and exercise actual Studio
      interactions, home/room isolation, stale selections, and flag-off/on behavior.
      Do not replace browser interaction with unit tests or skip missing dependencies.
    kind: browser
    paths:
    - web/*
    - tests/browser/*
    commands:
    - ['{python}', '-m', 'pytest', '-q', '-o', 'addopts=', '--browser', 'chromium', 'tests/browser']
  migration:
    description: >-
      Stored-data migration tests in tests/migrations. Implement legacy fixtures,
      data preservation, repeat migration, partial-failure recovery, and flag-off
      compatibility after migration. Use isolated temporary storage, never live data.
      Select this profile for every plan declaring requires_migration.
    kind: migration
    paths:
    - migrations/*
    - app/migrations/*
    - app/store.py
    - app/project.py
    - tests/migrations/*
    commands:
    - ['{python}', '-m', 'pytest', '-q', '-o', 'addopts=', 'tests/migrations']
