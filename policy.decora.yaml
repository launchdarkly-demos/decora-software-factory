# Explicit opt-in policy for real Decora draft PRs. Publishing still requires --push.
version: 1
max_retries:
  verify: 2
  review: 1
  govern: 1
  plan: 2
  plan_repair: 2
  plan_scope: 2
  build: 3
stage_timeout_seconds:
  intake: 30
  context: 60
  plan: 120
  govern_plan: 30
  build: 180
  verify: 600
  ensure_flag: 90
  review: 120
  govern_ship: 30
  draft_pr: 60
command_timeout_seconds: 180
command_environment:
  # Catalog-only regression needs settings to parse; no model credential is needed.
  ANTHROPIC_API_KEY: factory-test-not-a-real-key
allow_commands:
- pytest
- ruff
- mypy
- python
- python3
- git
deny_command_patterns:
- git push
- git reset
- git clean
- git rebase
- --no-verify
- sudo
- rm -rf
- rm -r
git_subcommands:
- status
- diff
- add
- commit
- log
- show
- rev-parse
deny_paths:
- .env
- .env.*
- '**/*secret*'
- '**/*credential*'
- app/pim/**
approvals:
  auto_approve_risk:
  - low
  pause_on_ambiguous: true
  pause_on_risk:
  - high
flags:
  enabled: true
  key_pattern: '^decora-[a-z0-9-]+$'
  must_default_off: true

rollout_rules:
  user_facing_behavior: {flag: required, guarded_rollout: required, human_pause: false}
  ui_cosmetic: {flag: optional, guarded_rollout: none, human_pause: false}
  backend_internal:
    flag: required
    guarded_rollout: none
    human_pause: false
    required_for_risk: [medium, high]
    required_for_large_change: true
  data_migration: {flag: required, guarded_rollout: required, human_pause: true}
  refactor: {flag: forbidden, guarded_rollout: none, human_pause: false}
  docs_only: {flag: forbidden, guarded_rollout: none, human_pause: false}
  tests_only: {flag: forbidden, guarded_rollout: none, human_pause: false}
  config_ci: {flag: forbidden, guarded_rollout: none, human_pause: false}
  dependency: {flag: forbidden, guarded_rollout: none, human_pause: false}
guarded_rollout:
  # Metrics live in LaunchDarkly project alexis-interior-design-demo-app. All are
  # LowerThanBaseline count guardrails with the user context kind.
  # decora-request-error is fed by decor-agent server.py on failed API requests and
  # chat turns (event decora_request_error), so it tracks real user flows.
  default_metric_key: decora-request-error
  allowed_metric_keys:
  - decora-request-error             # failed Decora API requests / chat turns per user
  - ld_autogen__ai-completion-error  # LLM completion errors per user (low volume)
  min_sample_size: 100
  rollback_on_regression: true
  stages: [1, 5, 25, 50, 100]

launchdarkly:
  project_key: alexis-interior-design-demo-app
  environments:
  - test
  - production
  production_environment: production
pull_request:
  draft_only: true
  allow_push: true
regression_tests:
- test_api_project.py
- test_board.py
- test_flinch_gate.py

# These are required test contracts, not a claim that the target suites exist.
# The implementation must provide the suites; missing tests/tooling fail verification.
verification_profiles:
  studio-browser:
    description: >-
      Real Chromium acceptance tests using pytest-playwright in tests/browser.
      Implement fixtures that start/stop the isolated app and exercise actual Studio
      interactions, home/room isolation, stale selections, and flag-off/on behavior.
      Do not replace browser interaction with unit tests or skip missing dependencies.
    kind: browser
    paths:
    - web/*
    - tests/browser/*
    commands:
    - ['{python}', '-m', 'pytest', '-q', '-o', 'addopts=', '--browser', 'chromium', 'tests/browser']
  migration:
    description: >-
      Stored-data migration tests in tests/migrations. Implement legacy fixtures,
      data preservation, repeat migration, partial-failure recovery, and flag-off
      compatibility after migration. Use isolated temporary storage, never live data.
      Select this profile for every plan declaring requires_migration.
    kind: migration
    paths:
    - migrations/*
    - app/migrations/*
    - app/store.py
    - app/project.py
    - tests/migrations/*
    commands:
    - ['{python}', '-m', 'pytest', '-q', '-o', 'addopts=', 'tests/migrations']
