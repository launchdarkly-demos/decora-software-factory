# Permissions and approval boundaries for factory jobs.
# Agents never merge, never force-push, and never turn a new user-facing
# behavior on. A human does that, outside this process.

version: 1

max_retries:
  verify: 2
  missing_files: 3
  review: 1
  govern: 1
  plan: 2
  plan_repair: 2
  build: 3

stage_timeout_seconds:
  intake: 30
  context: 60
  plan: 120
  govern_plan: 30
  build: 180
  verify: 180
  ensure_flag: 90
  review: 120
  govern_ship: 30
  draft_pr: 60

command_timeout_seconds: 180

allow_commands:
  - pytest
  - ruff
  - mypy
  - python
  - python3
  - git

# Substrings matched against the full command line.
deny_command_patterns:
  - "git push"
  - "git reset"
  - "git clean"
  - "git rebase"
  - "--no-verify"
  - "sudo"
  - "rm -rf"
  - "rm -r"

git_subcommands:
  - status
  - diff
  - add
  - commit
  - log
  - show
  - rev-parse

deny_paths:
  - ".env"
  - ".env.*"
  - "**/*secret*"
  - "**/*credential*"
  - "app/pim/**"

approvals:
  auto_approve_risk:
    - low
  pause_on_ambiguous: true
  pause_on_risk:
    - high

flags:
  enabled: false
  key_pattern: '^decora-[a-z0-9-]+$'
  must_default_off: true

rollout_rules:
  user_facing_behavior: {flag: required, guarded_rollout: required, human_pause: false}
  ui_cosmetic: {flag: optional, guarded_rollout: none, human_pause: false}
  backend_internal:
    flag: required
    guarded_rollout: none
    human_pause: false
    required_for_risk: [medium, high]
    required_for_large_change: true
  data_migration: {flag: required, guarded_rollout: required, human_pause: true}
  refactor: {flag: forbidden, guarded_rollout: none, human_pause: false}
  docs_only: {flag: forbidden, guarded_rollout: none, human_pause: false}
  tests_only: {flag: forbidden, guarded_rollout: none, human_pause: false}
  config_ci: {flag: forbidden, guarded_rollout: none, human_pause: false}
  dependency: {flag: forbidden, guarded_rollout: none, human_pause: false}
guarded_rollout:
  default_metric_key: ""  # TODO: owner must choose an allowed rollout metric.
  allowed_metric_keys: []  # Owner-maintained LaunchDarkly metric keys.
  min_sample_size: 100
  rollback_on_regression: true
  stages: [1, 5, 25, 50, 100]

launchdarkly:
  project_key: alexis-interior-design-demo-app
  environments:
    - test
    - production
  production_environment: production

pull_request:
  draft_only: true
  allow_push: false
