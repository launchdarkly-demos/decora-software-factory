[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "Multi-agent software factory for Decora"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
  "opentelemetry-api>=1.27",
  "openai-agents>=0.2",
  "temporalio>=1.9,<2",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.2"]
otel = ["opentelemetry-sdk>=1.27"]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["factory"]

[tool.mypy]
python_version = "3.11"
packages = ["factory"]
ignore_missing_imports = true
check_untyped_defs = true
